# =============================================================================
# luminary-ha test entities
# =============================================================================
input_boolean:
  test_motion_1:
    name: "Test — Motion Trigger 1"
    icon: mdi:motion-sensor
  test_motion_2:
    name: "Test — Motion Trigger 2"
    icon: mdi:motion-sensor
  test_light_state:
    name: "Test — Light On/Off State"
    icon: mdi:lightbulb

input_number:
  test_light_brightness:
    name: "Test — Light Brightness"
    min: 0
    max: 255
    step: 1
    initial: 255
    icon: mdi:brightness-6
  test_hw_timeout_source:
    name: "Test — Hardware Timeout Source"
    min: 0
    max: 600
    step: 1
    initial: 10
    unit_of_measurement: "s"
    icon: mdi:timer-outline

input_button:
  test_switch_single_up:
    name: "Test Switch — Single Tap Up"
    icon: mdi:chevron-up
  test_switch_single_down:
    name: "Test Switch — Single Tap Down"
    icon: mdi:chevron-down
  test_switch_double_up:
    name: "Test Switch — Double Tap Up"
    icon: mdi:chevron-double-up
  test_switch_double_down:
    name: "Test Switch — Double Tap Down"
    icon: mdi:chevron-double-down
  test_switch_scene3:
    name: "Test Switch — Scene 3 (Reset)"
    icon: mdi:restore

template:
  - binary_sensor:
      - name: "Test Hallway Motion 1"
        unique_id: test_hallway_motion_sensor_1
        device_class: motion
        state: "{{ is_state('input_boolean.test_motion_1', 'on') }}"
      - name: "Test Hallway Motion 2"
        unique_id: test_hallway_motion_sensor_2
        device_class: motion
        state: "{{ is_state('input_boolean.test_motion_2', 'on') }}"

  - light:
      - name: "Test Hallway Light"
        unique_id: test_hallway_light
        state: "{{ states('input_boolean.test_light_state') }}"
        level: "{{ states('input_number.test_light_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_light_state
          - action: input_number.set_value
            target:
              entity_id: input_number.test_light_brightness
            data:
              value: "{{ brightness | default(255) | int }}"
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_light_state
        set_level:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_light_state
          - action: input_number.set_value
            target:
              entity_id: input_number.test_light_brightness
            data:
              value: "{{ brightness }}"

automation:
  - id: test_zwave_single_up
    alias: "Test — Fire Z-Wave Single Tap Up"
    trigger:
      - platform: state
        entity_id: input_button.test_switch_single_up
    action:
      - event: zwave_js_value_notification
        event_data:
          domain: zwave_js
          node_id: 1
          home_id: 0
          endpoint: 0
          device_id: test_switch_device
          command_class: 91
          command_class_name: Central Scene
          property: scene
          property_key: "001"
          value: "KeyPressed"

  - id: test_zwave_single_down
    alias: "Test — Fire Z-Wave Single Tap Down"
    trigger:
      - platform: state
        entity_id: input_button.test_switch_single_down
    action:
      - event: zwave_js_value_notification
        event_data:
          domain: zwave_js
          node_id: 1
          home_id: 0
          endpoint: 0
          device_id: test_switch_device
          command_class: 91
          command_class_name: Central Scene
          property: scene
          property_key: "002"
          value: "KeyPressed"

  - id: test_zwave_double_up
    alias: "Test — Fire Z-Wave Double Tap Up"
    trigger:
      - platform: state
        entity_id: input_button.test_switch_double_up
    action:
      - event: zwave_js_value_notification
        event_data:
          domain: zwave_js
          node_id: 1
          home_id: 0
          endpoint: 0
          device_id: test_switch_device
          command_class: 91
          command_class_name: Central Scene
          property: scene
          property_key: "001"
          value: "KeyPressed2x"

  - id: test_zwave_double_down
    alias: "Test — Fire Z-Wave Double Tap Down"
    trigger:
      - platform: state
        entity_id: input_button.test_switch_double_down
    action:
      - event: zwave_js_value_notification
        event_data:
          domain: zwave_js
          node_id: 1
          home_id: 0
          endpoint: 0
          device_id: test_switch_device
          command_class: 91
          command_class_name: Central Scene
          property: scene
          property_key: "002"
          value: "KeyPressed2x"

  - id: test_zwave_scene3
    alias: "Test — Fire Z-Wave Scene 3"
    trigger:
      - platform: state
        entity_id: input_button.test_switch_scene3
    action:
      - event: zwave_js_value_notification
        event_data:
          domain: zwave_js
          node_id: 1
          home_id: 0
          endpoint: 0
          device_id: test_switch_device
          command_class: 91
          command_class_name: Central Scene
          property: scene
          property_key: "003"
          value: "KeyPressed"
